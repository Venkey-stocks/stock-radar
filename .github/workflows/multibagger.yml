name: Multibagger scan
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "yes = quick test (120 stocks), no = full scan"
        type: choice
        default: "yes"
        options:
          - "yes"
          - "no"
  schedule:
    - cron: "30 4 * * 6"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests
      - name: Multibagger scan
        run: python scan_multibagger.py
        env:
          QUICK: ${{ github.event.inputs.quick }}
      - name: Save data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "multibagger data" || echo "no changes"
          git pull --rebase || true
          git push
