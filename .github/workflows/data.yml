name: Fetch data
on:
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * 1-5"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests
      - run: python fetch_data.py
      - name: Events
        run: python fetch_events.py
        continue-on-error: true
      - name: Results calendar
        run: python fetch_results_calendar.py
        continue-on-error: true
      - name: Ultra scan
        run: python scan_ultra.py
        continue-on-error: true
      - name: Short term scan
        run: python scan_short.py
        continue-on-error: true
      - name: Early movers scan
        run: python scan_early.py
        continue-on-error: true
      - name: New listings scan
        run: python scan_newlistings.py
        continue-on-error: true
      - name: Fundamentals
        run: python fetch_fundamentals.py
        continue-on-error: true
      - name: Apply fundamentals
        run: python apply_fundamentals.py
        continue-on-error: true
      - name: Save history
        run: python save_history.py
        continue-on-error: true
      - name: Market health
        run: python market_health.py
        continue-on-error: true
      - name: Backfill excluded history
        run: python backfill_excluded.py
        continue-on-error: true
      - name: Performance tracker
        run: python track_performance.py
        continue-on-error: true
      - name: Miss report
        run: python miss_report.py
        continue-on-error: true
      - name: Make charts
        run: python make_charts.py
        continue-on-error: true
      - name: RS rank
        run: python compute_rs.py
        continue-on-error: true
      - name: Save data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "update data" || echo "no changes"
          git push
      - name: Telegram alert
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: python send_telegram.py
