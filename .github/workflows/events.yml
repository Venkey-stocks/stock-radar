name: Fetch events
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python fetch_events.py
      - name: Save result
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.csv data/event_desc_counts.txt
          git commit -m "events data" || echo "no changes"
          git push
