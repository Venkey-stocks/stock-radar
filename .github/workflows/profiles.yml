name: Profiles

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install pandas yfinance requests

      - name: Fetch profiles
        run: python fetch_profiles.py

      - name: Save data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/profiles.json
          git diff --cached --quiet || git commit -m "Update profiles"
          git pull --rebase
          git push
