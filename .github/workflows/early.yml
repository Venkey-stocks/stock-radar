name: Early Movers

on:
  schedule:
    # సోమవారం నుండి శుక్రవారం వరకు ~6:10 PM IST (12:40 UTC)
    - cron: '40 12 * * 1-5'
  workflow_dispatch:

jobs:
  early:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance

      - name: Run scan_early.py
        run: python scan_early.py

      - name: Run make_charts.py
        run: python make_charts.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update Early Movers and charts"
          git push
