name: Test events
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python event_test.py
      - name: Save result
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/event_test.txt
          git commit -m "event test" || echo "no changes"
          git push
